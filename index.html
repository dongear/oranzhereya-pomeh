<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цветочный магазин «Помеха»</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Цветочный магазин «Помеха»</h1>
    <p>Звук становится растением. Файлы не покидают браузер.</p>
  </header>

  <div class="layout">
    <aside class="panel">
      <div class="seg" id="modes">
        <button data-v="plant" aria-pressed="true">Новое</button>
        <button data-v="feed" aria-pressed="false">Подкормить</button>
      </div>

      <label class="drop" id="drop">
        <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac">
        <strong id="dropTitle">Загрузить звук</strong>
        <span>mp3, wav или перетащить</span>
      </label>
      <button class="btn" id="mic">Запись</button>

      <div class="actions row">
        <button class="btn" id="again">Иначе</button>
        <button class="btn" id="listen">Слушать</button>
      </div>

      <div class="group">
        <h2>Голос</h2>
        <div class="knobs" id="voiceKnobs"></div>
        <div class="knob-row">
          <label class="check"><input type="checkbox" id="reverse"> Реверс</label>
          <button class="link" id="voiceReset">Сброс</button>
        </div>
      </div>

      <div class="group">
        <h2>Вид</h2>
        <div class="knobs" id="viewKnobs"></div>
      </div>

      <div class="group">
        <h2>Фон</h2>
        <div class="seg" id="palettes"></div>
      </div>

      <div class="group">
        <h2>Формат</h2>
        <div class="seg" id="formats">
          <button data-v="square" aria-pressed="true">1:1</button>
          <button data-v="wide" aria-pressed="false">16:9</button>
        </div>
      </div>

      <div class="checks">
        <label class="check"><input type="checkbox" id="caption" checked> Подпись</label>
        <label class="check"><input type="checkbox" id="transparent"> Без фона</label>
      </div>

      <div class="group">
        <h2>Сохранить</h2>
        <div class="actions row">
          <button class="btn primary" id="save">PNG</button>
          <button class="btn" id="saveVoice">WAV</button>
        </div>
      </div>
    </aside>

    <main class="stage">
      <div class="frame" id="frame"><canvas id="cv" role="img" aria-label="Растение из звука"></canvas></div>
      <p class="note" id="note" aria-live="polite"></p>

      <section class="passport" aria-label="Паспорт растения">
        <p class="latin" id="pLatin"></p>
        <p class="meta" id="pMeta"></p>
        <dl class="stats" id="stats"></dl>
      </section>
    </main>
  </div>

  <section class="shelf">
    <h2>Образцы</h2>
    <div class="shelf-grid" id="shelf"></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
