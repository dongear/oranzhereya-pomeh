<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Звук в рисунок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E8E0; --panel:#F2F5F0; --ink:#16241B; --muted:#56665B; --line:#BCC8BC; --accent:#A3285E; --accent-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A15; --panel:#1A241E; --ink:#E2EBE3; --muted:#93A597; --line:#2E3D33; --accent:#E06BA3; --accent-ink:#1A0E14;
  }
}
:root[data-theme="dark"]{
  --bg:#121A15; --panel:#1A241E; --ink:#E2EBE3; --muted:#93A597; --line:#2E3D33; --accent:#E06BA3; --accent-ink:#1A0E14;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 40px}
header{margin-bottom:22px}
h1{font-family:"Cormorant Garamond","Georgia",serif;font-weight:500;font-size:clamp(34px,5vw,54px);line-height:1;margin:0 0 8px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:60ch}
.layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
.drop{display:block;border:1.5px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop strong{display:block;font-weight:600;margin-bottom:2px}
.drop span{color:var(--muted);font-size:13px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.group h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.swatch{font:inherit;font-size:13px;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;flex-shrink:0;border-radius:5px;overflow:hidden;border:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}
.chips i{display:block;width:9px;height:20px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:11px 14px;border-radius:10px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;margin:0}
.stats dt{color:var(--muted)}
.stats dd{margin:0;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.frame{border-radius:8px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.frame.checker{background-image:conic-gradient(#d6d6d6 25%,#f4f4f4 0 50%,#d6d6d6 0 75%,#f4f4f4 0);background-size:22px 22px}
.frame img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain}
.note{font-size:13px;color:var(--muted);margin:0;min-height:1.5em}
.note.err{color:var(--accent)}
canvas{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Звук в рисунок</h1>
    <p>Загрузи mp3 или wav. Страница разберёт громкость, высоту, шумность и резкие всплески звука и нарисует по ним картинку. У каждого звука свой рисунок.</p>
  </header>

  <div class="layout">
    <aside class="panel">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac">
        <strong>Выбери аудиофайл</strong>
        <span>или перетащи его сюда</span>
      </label>

      <div class="group">
        <h2>Стиль</h2>
        <div class="seg" id="styles">
          <button data-v="scribble" aria-pressed="true">Каракули</button>
          <button data-v="flower" aria-pressed="false">Цветок</button>
          <button data-v="threads" aria-pressed="false">Нити</button>
        </div>
      </div>

      <div class="group">
        <h2>Палитра</h2>
        <div class="swatches" id="palettes"></div>
      </div>

      <div class="group">
        <h2>Формат</h2>
        <div class="seg" id="formats">
          <button data-v="square" aria-pressed="true">Квадрат</button>
          <button data-v="wide" aria-pressed="false">16:9 для слайда</button>
        </div>
      </div>

      <label class="check"><input type="checkbox" id="transparent"> Прозрачный фон</label>

      <div class="actions">
        <button class="btn" id="again">Другой вариант</button>
        <button class="btn primary" id="save">Сохранить PNG</button>
      </div>

      <dl class="stats" id="stats"></dl>
    </aside>

    <main class="stage">
      <div class="frame" id="frame"><img id="out" alt="Рисунок, построенный по звуку"></div>
      <p class="note" id="note">Сейчас показан пример. Загрузи свой звук, чтобы получить его рисунок.</p>
    </main>
  </div>
</div>
<canvas id="cv"></canvas>

<script>
(function(){
"use strict";

/* ---------- palettes ---------- */
const PALETTES = {
  greenhouse:{name:"Оранжерея", bg:"#DDE5DA", inks:["#1F3B2C","#4E7A55","#B8336A","#8FA97A"]},
  night:{name:"Ночная теплица", bg:"#1A1424", inks:["#E25BB0","#8C6BE0","#F2C6E8","#4FD1A5"]},
  cyan:{name:"Цианотипия", bg:"#1C4E8A", inks:["#F4F7FB","#BFD3EA","#E8F0FA","#8DB0D8"]},
  ink:{name:"Чернила", bg:"#FFFFFF", inks:["#111111","#444444","#777777","#222222"]}
};

const state = {analysis:null, style:"scribble", palette:"greenhouse", format:"square", transparent:false, variant:0, name:"primer"};

const $ = id => document.getElementById(id);
const note = $("note"), out = $("out"), cv = $("cv"), frame = $("frame");

/* ---------- utils ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setNote(t,err){note.textContent=t;note.classList.toggle("err",!!err)}

function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;
    if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang),half=len>>1;
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let k=0;k<half;k++){const a=i+k,b=a+half;
        const tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;
        re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;
        const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr}}}
}

/* ---------- analysis ---------- */
const NB=16, N=2048;
async function analyze(file){
  const buf=await file.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC();
  let audio;
  try{audio=await ac.decodeAudioData(buf)}finally{try{ac.close()}catch(e){}}
  const sr=audio.sampleRate, len=audio.length, chs=audio.numberOfChannels;
  const mono=new Float32Array(Math.max(len,N));
  for(let c=0;c<chs;c++){const d=audio.getChannelData(c);for(let i=0;i<len;i++)mono[i]+=d[i]/chs}
  const maxFrames=600;
  const hop=Math.max(512,Math.floor((mono.length-N)/maxFrames)||512);
  const win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const nyq=sr/2, hiF=Math.min(16000,nyq*0.95);
  const edges=[];for(let b=0;b<=NB;b++)edges.push(Math.round(40*Math.pow(hiF/40,b/NB)/nyq*(N/2)));
  const re=new Float32Array(N),im=new Float32Array(N);
  let prev=null; const frames=[];
  let seed=0;
  for(let start=0;start+N<=mono.length;start+=hop){
    let sum=0,zc=0;
    for(let i=0;i<N;i++){const s=mono[start+i];sum+=s*s;re[i]=s*win[i];im[i]=0;if(i&&((s>=0)!==(mono[start+i-1]>=0)))zc++}
    seed=(seed+Math.floor(Math.abs(mono[start+(N>>1)])*1e6))|0;
    fft(re,im);
    const half=N/2,mag=new Float32Array(half);
    let ms=0,cs=0,ls=0,flux=0;
    for(let k=1;k<half;k++){const m=Math.hypot(re[k],im[k]);mag[k]=m;ms+=m;cs+=m*k;ls+=Math.log(m+1e-9);
      if(prev){const d=m-prev[k];if(d>0)flux+=d}}
    const mean=ms/(half-1);
    const bands=new Float32Array(NB);
    for(let b=0;b<NB;b++){let a=Math.max(1,edges[b]),z=Math.max(a+1,edges[b+1]),s=0;for(let k=a;k<z&&k<half;k++)s+=mag[k];bands[b]=s/(z-a)}
    frames.push({rms:Math.sqrt(sum/N),cen:ms?(cs/ms)/half*nyq:0,flat:mean>0?Math.exp(ls/(half-1))/mean:0,zcr:zc/N,bands,flux});
    prev=mag;
  }
  return finish(frames,audio.duration,seed);
}

function finish(frames,duration,seed){
  const maxR=Math.max(...frames.map(f=>f.rms),1e-9), maxF=Math.max(...frames.map(f=>f.flux),1e-9);
  const bandMax=new Float32Array(NB);let gMax=1e-9;
  frames.forEach(f=>{for(let b=0;b<NB;b++){bandMax[b]=Math.max(bandMax[b],f.bands[b]);gMax=Math.max(gMax,f.bands[b])}});
  frames.forEach(f=>{
    f.rms=f.rms/maxR; f.flux=f.flux/maxF;
    f.cen=clamp(f.cen/8000,0,1); f.flat=clamp(f.flat*3,0,1); f.zcr=clamp(f.zcr/0.3,0,1);
    for(let b=0;b<NB;b++){const v=f.bands[b];f.bands[b]=clamp(Math.sqrt(v/(bandMax[b]||1e-9))*0.6+Math.sqrt(v/gMax)*0.4,0,1)}
  });
  const fl=frames.map(f=>f.flux),m=fl.reduce((a,b)=>a+b,0)/fl.length,sd=Math.sqrt(fl.reduce((a,b)=>a+(b-m)*(b-m),0)/fl.length);
  let onsets=0;
  frames.forEach((f,i)=>{f.onset=f.flux>m+1.4*sd&&f.flux>=(fl[i-1]||0)&&f.flux>=(fl[i+1]||0);if(f.onset)onsets++});
  const avg=k=>frames.reduce((a,f)=>a+f[k],0)/frames.length;
  return {frames,duration,seed:seed||12345,avgRms:avg("rms"),avgCen:avg("cen"),avgFlat:avg("flat"),onsets};
}

function demoAnalysis(){
  const r=mulberry32(7),frames=[];
  for(let i=0;i<420;i++){const t=i/420;
    const bands=new Float32Array(NB);
    for(let b=0;b<NB;b++)bands[b]=clamp(0.25+0.45*Math.sin(t*9+b*0.5)*Math.cos(t*3-b*0.2)+r()*0.25,0,1);
    frames.push({rms:0.5+0.4*Math.sin(t*12),cen:0.3+0.3*Math.sin(t*5),flat:0.2+0.3*r(),zcr:0.3*r(),bands,flux:r()});
  }
  frames.forEach(f=>{f.rms=clamp(f.rms,0,1);f.onset=f.flux>0.93});
  return {frames,duration:0,seed:4242,avgRms:0.5,avgCen:0.3,avgFlat:0.35,onsets:frames.filter(f=>f.onset).length,demo:true};
}

/* ---------- drawing helpers ---------- */
function smoothPath(ctx,pts,closed){
  const n=pts.length;if(n<2)return;
  ctx.moveTo(pts[0][0],pts[0][1]);
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){
    const p0=closed?pts[(i-1+n)%n]:pts[Math.max(i-1,0)];
    const p1=pts[i%n],p2=pts[(i+1)%n];
    const p3=closed?pts[(i+2)%n]:pts[Math.min(i+2,n-1)];
    ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);
  }
  if(closed)ctx.closePath();
}
const gE=(f,a,b)=>{let s=0;for(let k=a;k<b;k++)s+=f.bands[k];return s/(b-a)};
function smoothArr(arr,w,circ){const n=arr.length,o=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0,c=0;for(let k=-w;k<=w;k++){let j=i+k;if(circ)j=(j+n)%n;else if(j<0||j>=n)continue;s+=arr[j];c++}o[i]=s/c}return o}
function sample(F,n){const o=[];for(let i=0;i<n;i++)o.push(F[Math.floor(i/n*F.length)]);return o}

/* ---------- styles ---------- */
function drawScribble(ctx,W,H,A,rng,pal){
  const F=A.frames,M=Math.min(W,H),cx=W/2,cy=H/2,lim=Math.min(W,H)*0.42,limX=W*0.44,limY=H*0.42;
  const groups=[[0,5],[5,11],[11,16]],wm=[1.5,1,0.7];
  const stepScale=(M*7.5)/(F.length*16);
  ctx.lineCap="round";ctx.lineJoin="round";
  groups.forEach((g,l)=>{
    let x=cx+(rng()-.5)*M*.25,y=cy+(rng()-.5)*M*.25,ang=rng()*Math.PI*2,dir=rng()<.5?1:-1;
    const pts=[],ws=[],hi=[];
    F.forEach(f=>{
      const e=gE(f,g[0],g[1]);
      ang+=(rng()-.5)*(0.3+f.zcr*2+f.flat*1.6)+(f.cen-0.35)*0.18*dir;
      const ex=Math.abs(x-cx)/limX,ey=Math.abs(y-cy)/limY,edge=Math.max(ex,ey);
      if(edge>0.65){const ta=Math.atan2(cy-y,cx-x);const diff=((ta-ang)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI;ang+=diff*Math.min(1,(edge-0.65)/0.35)*0.6}
      const step=(4+e*22+f.rms*8)*stepScale;
      const w=(0.6+e*5+f.rms*3)*wm[l]*M/1000;
      if(f.onset&&rng()<0.85){
        const r=(10+e*70)*M/1000,ccx=x+Math.cos(ang+dir*Math.PI/2)*r,ccy=y+Math.sin(ang+dir*Math.PI/2)*r,a0=Math.atan2(y-ccy,x-ccx);
        for(let k=1;k<=12;k++){const a=a0+dir*k/12*Math.PI*2;pts.push([ccx+Math.cos(a)*r,ccy+Math.sin(a)*r]);ws.push(w*1.2);hi.push(0)}
        dir*=-1;
      }
      x+=Math.cos(ang)*step;y+=Math.sin(ang)*step;
      pts.push([x,y]);ws.push(w);hi.push(gE(f,11,16));
    });
    ctx.strokeStyle=pal.inks[l];ctx.globalAlpha=0.88;
    const C=5;
    for(let i=0;i<pts.length-1;i+=C){
      const seg=pts.slice(i,Math.min(i+C+1,pts.length));
      ctx.lineWidth=ws[Math.min(i+(C>>1),ws.length-1)];
      ctx.beginPath();smoothPath(ctx,seg,false);ctx.stroke();
    }
    ctx.fillStyle=pal.inks[3];ctx.globalAlpha=0.75;
    pts.forEach((p,i)=>{if(hi[i]>0.62&&rng()<0.35){const r=(1+rng()*3.5)*M/1000,o=(rng()-.5)*30*M/1000;ctx.beginPath();ctx.arc(p[0]+o,p[1]-o,r,0,Math.PI*2);ctx.fill()}});
  });
  ctx.globalAlpha=1;
}

function drawFlower(ctx,W,H,A,rng,pal){
  const M=Math.min(W,H),cx=W/2,cy=H/2,R=M*0.44,n=360,F=sample(A.frames,n);
  const petals=3+Math.floor(A.avgCen*10)+Math.floor(rng()*3),rings=5;
  ctx.lineJoin="round";
  for(let k=rings-1;k>=0;k--){
    const b0=Math.floor(k/rings*NB),b1=Math.floor((k+1)/rings*NB);
    const e=smoothArr(F.map(f=>gE(f,b0,b1)),4,true);
    const base=R*(0.2+0.15*k),rot=rng()*Math.PI*2/petals,sharp=1+A.avgFlat*3+k*0.3;
    const pts=[];
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2;
      const shape=0.5+0.5*Math.pow(Math.abs(Math.cos(petals*(a+rot)/2)),sharp);
      const r=base*shape+e[i]*R*0.2+(rng()-.5)*R*0.012*(F[i].flat+0.2);
      pts.push([cx+Math.cos(a-Math.PI/2)*r,cy+Math.sin(a-Math.PI/2)*r])}
    const col=pal.inks[k%pal.inks.length];
    ctx.beginPath();smoothPath(ctx,pts,true);
    ctx.globalAlpha=0.13;ctx.fillStyle=col;ctx.fill();
    ctx.globalAlpha=0.9;ctx.strokeStyle=col;ctx.lineWidth=(1.2+k*0.5)*M/1000;ctx.stroke();
  }
  ctx.lineCap="round";
  A.frames.forEach((f,i)=>{if(!f.onset)return;
    const a=i/A.frames.length*Math.PI*2-Math.PI/2+(rng()-.5)*0.05,r1=R*0.07,r2=R*(0.18+f.rms*0.45+rng()*0.1);
    ctx.globalAlpha=0.8;ctx.strokeStyle=pal.inks[2];ctx.lineWidth=1.4*M/1000;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
    const bend=(rng()-.5)*0.25;ctx.quadraticCurveTo(cx+Math.cos(a+bend)*(r1+r2)/2,cy+Math.sin(a+bend)*(r1+r2)/2,cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);ctx.stroke();
    ctx.fillStyle=pal.inks[2];ctx.beginPath();ctx.arc(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2,(3+f.flux*7)*M/1000,0,Math.PI*2);ctx.fill();
  });
  const rc=3+Math.round(A.avgRms*6);
  ctx.strokeStyle=pal.inks[0];
  for(let i=0;i<rc;i++){ctx.globalAlpha=0.85-i*0.08;ctx.lineWidth=1.2*M/1000;ctx.beginPath();ctx.arc(cx,cy,R*(0.015+i*0.012),0,Math.PI*2);ctx.stroke()}
  ctx.globalAlpha=1;
}

function drawThreads(ctx,W,H,A,rng,pal){
  const M=Math.min(W,H),mx=W*0.07,my=H*0.1,n=Math.min(A.frames.length,420),F=sample(A.frames,n);
  const gap=(H-2*my)/(NB+1);
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle=pal.inks[1];ctx.lineWidth=1*M/1000;
  F.forEach((f,i)=>{if(!f.onset)return;const x=mx+i/(n-1)*(W-2*mx);ctx.globalAlpha=0.18;ctx.beginPath();ctx.moveTo(x,my*0.6);ctx.lineTo(x,H-my*0.6);ctx.stroke()});
  for(let b=0;b<NB;b++){
    const e=smoothArr(F.map(f=>f.bands[b]),2,false);
    const baseY=H-my-(b+1)*gap;let avg=0;
    const pts=F.map((f,i)=>{avg+=e[i];return[mx+i/(n-1)*(W-2*mx),baseY-e[i]*gap*2.2+(rng()-.5)*gap*0.35*f.flat]});
    avg/=n;
    ctx.globalAlpha=0.85;ctx.strokeStyle=pal.inks[b%pal.inks.length];ctx.lineWidth=(0.8+avg*4.5)*M/1000;
    ctx.beginPath();smoothPath(ctx,pts,false);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

const STYLES={scribble:drawScribble,flower:drawFlower,threads:drawThreads};
const STYLE_NAMES={scribble:"karakuli",flower:"cvetok",threads:"niti"};

/* ---------- render ---------- */
function render(){
  const A=state.analysis;if(!A)return;
  const W=state.format==="wide"?2400:2000,H=state.format==="wide"?1350:2000;
  cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d"),pal=PALETTES[state.palette];
  ctx.clearRect(0,0,W,H);
  if(!state.transparent){ctx.fillStyle=pal.bg;ctx.fillRect(0,0,W,H)}
  const si=Object.keys(STYLES).indexOf(state.style);
  const rng=mulberry32((A.seed+state.variant*7919+si*131)|0);
  STYLES[state.style](ctx,W,H,A,rng,pal);
  out.src=cv.toDataURL("image/png");
  frame.classList.toggle("checker",state.transparent);
}

function fmtTime(s){const m=Math.floor(s/60),r=Math.round(s%60);return m+":"+String(r).padStart(2,"0")}
function level(v){return v<0.33?"низкая":v<0.6?"средняя":"высокая"}
function showStats(){
  const A=state.analysis,dl=$("stats");
  const rows=A.demo?[["Файл","пример"]]:[["Файл",state.fileLabel],["Длительность",fmtTime(A.duration)],["Громкость",level(A.avgRms)],["Яркость звука",level(A.avgCen*2)],["Шумность",level(A.avgFlat)],["Резких всплесков",String(A.onsets)]];
  dl.innerHTML="";rows.forEach(([k,v])=>{const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=k;dd.textContent=v;dd.title=v;dl.append(dt,dd)});
}

/* ---------- UI ---------- */
const palWrap=$("palettes");
Object.entries(PALETTES).forEach(([k,p])=>{
  const b=document.createElement("button");b.className="swatch";b.dataset.v=k;b.setAttribute("aria-pressed",k===state.palette);
  const chips=document.createElement("span");chips.className="chips";
  [p.bg,...p.inks.slice(0,3)].forEach(c=>{const i=document.createElement("i");i.style.background=c;chips.append(i)});
  const t=document.createElement("span");t.textContent=p.name;b.append(chips,t);palWrap.append(b);
});
function bindSeg(el,key){el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  state[key]=b.dataset.v;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()})}
bindSeg($("styles"),"style");bindSeg(palWrap,"palette");bindSeg($("formats"),"format");
$("transparent").addEventListener("change",e=>{state.transparent=e.target.checked;render()});
$("again").addEventListener("click",()=>{state.variant++;render()});

async function handleFile(file){
  if(!file)return;
  setNote("Слушаю звук…");
  try{
    const A=await analyze(file);
    if(!A.frames.length)throw new Error("short");
    state.analysis=A;state.variant=0;
    state.fileLabel=file.name;
    state.name=file.name.replace(/\.[^.]+$/,"").replace(/[^\p{L}\p{N}_-]+/gu,"_").slice(0,60)||"zvuk";
    render();showStats();
    setNote("Готово. «Другой вариант» перерисует тот же звук по-новому.");
  }catch(err){
    setNote("Не получилось прочитать этот файл. Попробуй mp3 или wav длиннее полсекунды.",true);
  }
}
$("file").addEventListener("change",e=>{handleFile(e.target.files[0]);e.target.value=""});
const drop=$("drop");
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];handleFile(f)});

/* ---------- save ---------- */
let downloadsP=Promise.resolve(null);
try{if(window.claude&&typeof window.claude.use==="function")downloadsP=window.claude.use("downloads").catch(()=>null)}catch(e){}
$("save").addEventListener("click",async()=>{
  const fname=state.name+"_"+STYLE_NAMES[state.style]+".png";
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  let dl=null;try{dl=await downloadsP}catch(e){}
  if(dl){
    try{await dl.save({filename:fname,data:blob});setNote("Картинка сохранена.");return}
    catch(err){if(err&&err.code==="declined"){setNote("Сохранение отменено.");return}
      if(err&&err.code==="rate_limited"){setNote("Окно сохранения уже открыто.");return}}
  }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.append(a);a.click();a.remove()}catch(e){}
  setNote("Если файл не скачался, нажми на картинку правой кнопкой и выбери «Сохранить изображение».");
});

state.analysis=demoAnalysis();state.fileLabel="пример";render();showStats();
})();
</script>
</body>
</html>
