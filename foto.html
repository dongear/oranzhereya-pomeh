<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фото · Цветочный магазин «Помеха»</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Цветочный магазин «Помеха»</h1>
    <p>Фото прорастает. Файлы не покидают браузер.</p>
  </header>
  <nav class="tabs">
    <a href="index.html">Растения из звука</a>
    <a href="nadpis.html">Вывески</a>
    <a href="foto.html" aria-current="page">Фото</a>
  </nav>

  <div class="layout">
    <aside class="panel">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*">
        <strong>Загрузить фото</strong>
        <span>jpg, png или перетащить</span>
      </label>

      <button class="btn" id="again">Иначе</button>

      <div class="group">
        <h2>Обработка</h2>
        <div class="knobs" id="knobs"></div>
      </div>

      <div class="group">
        <h2>Фон</h2>
        <div class="seg" id="palettes"></div>
      </div>

      <div class="group">
        <h2>Цвет</h2>
        <div class="seg" id="colorMode">
          <button data-v="mono" aria-pressed="true">Ч/б</button>
          <button data-v="color" aria-pressed="false">Цветной</button>
        </div>
        <button class="link" id="reshuffle" hidden>Другие цвета</button>
      </div>

      <div class="checks">
        <label class="check"><input type="checkbox" id="transparent"> Без фона</label>
      </div>

      <div class="group">
        <h2>Сохранить</h2>
        <div class="actions row">
          <button class="btn primary" id="savePng">PNG</button>
          <button class="btn" id="saveSvg">SVG</button>
        </div>
        <p class="hint">SVG можно перетащить в Figma.</p>
      </div>
    </aside>

    <main class="stage">
      <div class="frame empty" id="frame"><canvas id="cv" role="img" aria-label="Обработанное фото"></canvas></div>
      <p class="note" id="note" aria-live="polite"></p>
    </main>
  </div>
</div>

<script src="foto.js"></script>
</body>
</html>
